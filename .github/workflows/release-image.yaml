name: release image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published release tag to retry
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/geomarker-io/addr_geocoder

jobs:
  prepare:
    name: Validate release contract
    runs-on: ubuntu-24.04
    outputs:
      addr_base_digest: ${{ steps.contract.outputs.addr_base_digest }}
      addr_base_image: ${{ steps.contract.outputs.addr_base_image }}
      addr_base_ref: ${{ steps.contract.outputs.addr_base_ref }}
      addr_release_tag: ${{ steps.contract.outputs.addr_release_tag }}
      addr_version: ${{ steps.contract.outputs.addr_version }}
      created: ${{ steps.contract.outputs.created }}
      image_release_tag: ${{ steps.contract.outputs.image_release_tag }}
      revision: ${{ steps.contract.outputs.revision }}
      stow_version: ${{ steps.contract.outputs.stow_version }}
      taf_schema: ${{ steps.contract.outputs.taf_schema }}
      taf_year: ${{ steps.contract.outputs.taf_year }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}

      - name: Load and validate the version contract
        id: contract
        env:
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source .github/container-versions.env

          release_tag="${EVENT_RELEASE_TAG:-$DISPATCH_RELEASE_TAG}"
          if [[ "$release_tag" != "$IMAGE_RELEASE_TAG" ]]; then
            echo "release tag must be $IMAGE_RELEASE_TAG, received $release_tag" >&2
            exit 1
          fi

          if ! gh release view "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq 'select(.isDraft == false) | true' \
            | grep -qx true; then
            echo "release $release_tag must already be published" >&2
            exit 1
          fi

          if [[ ! "$ADDR_BASE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ADDR_BASE_DIGEST must pin the upstream multi-architecture OCI index" >&2
            exit 1
          fi

          created="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          revision="$(git rev-parse HEAD)"
          {
            echo "addr_base_digest=$ADDR_BASE_DIGEST"
            echo "addr_base_image=$ADDR_BASE_IMAGE"
            echo "addr_base_ref=$ADDR_BASE_IMAGE@$ADDR_BASE_DIGEST"
            echo "addr_release_tag=$ADDR_RELEASE_TAG"
            echo "addr_version=$ADDR_VERSION"
            echo "created=$created"
            echo "image_release_tag=$IMAGE_RELEASE_TAG"
            echo "revision=$revision"
            echo "stow_version=$STOW_VERSION"
            echo "taf_schema=$TAF_SCHEMA"
            echo "taf_year=$TAF_YEAR"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Require both upstream architectures
        env:
          ADDR_BASE_REF: ${{ steps.contract.outputs.addr_base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          raw_manifest="$(docker buildx imagetools inspect --raw "$ADDR_BASE_REF")"
          jq -e '
            (.manifests // []) as $manifests
            | any($manifests[];
                .platform.os == "linux" and
                .platform.architecture == "amd64")
              and
              any($manifests[];
                .platform.os == "linux" and
                .platform.architecture == "arm64")
          ' <<< "$raw_manifest" >/dev/null || {
            echo "the pinned addr base must contain linux/amd64 and linux/arm64" >&2
            exit 1
          }

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.image_release_tag }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            ADDR_BASE_IMAGE=${{ needs.prepare.outputs.addr_base_ref }}
            ADDR_BASE_NAME=${{ needs.prepare.outputs.addr_base_image }}
            ADDR_BASE_DIGEST=${{ needs.prepare.outputs.addr_base_digest }}
            ADDR_VERSION=${{ needs.prepare.outputs.addr_version }}
            STOW_VERSION=${{ needs.prepare.outputs.stow_version }}
            ADDR_RELEASE_TAG=${{ needs.prepare.outputs.addr_release_tag }}
            TAF_SCHEMA=${{ needs.prepare.outputs.taf_schema }}
            TAF_YEAR=${{ needs.prepare.outputs.taf_year }}
            BUILD_DATE=${{ needs.prepare.outputs.created }}
            VCS_REF=${{ needs.prepare.outputs.revision }}
            IMAGE_VERSION=${{ needs.prepare.outputs.image_release_tag }}
          provenance: mode=max
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true

      - name: Save image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-architecture index
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create the release index
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.image_release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t digest_files < <(find "$RUNNER_TEMP/digests" -type f | sort)
          if [[ "${#digest_files[@]}" -ne 2 ]]; then
            echo "expected two platform digests, found ${#digest_files[@]}" >&2
            exit 1
          fi

          sources=()
          for digest_file in "${digest_files[@]}"; do
            sources+=("${IMAGE}@sha256:$(basename "$digest_file")")
          done

          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=addr-geocode CLI with the complete 2025 TAF v2 bundle" \
            --tag "${IMAGE}:${RELEASE_TAG}" \
            "${sources[@]}"

      - name: Verify the published index
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.image_release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          raw_manifest="$(docker buildx imagetools inspect --raw "${IMAGE}:${RELEASE_TAG}")"
          jq -e '
            (.manifests // []) as $manifests
            | any($manifests[];
                .platform.os == "linux" and
                .platform.architecture == "amd64")
              and
              any($manifests[];
                .platform.os == "linux" and
                .platform.architecture == "arm64")
          ' <<< "$raw_manifest" >/dev/null

          docker buildx imagetools inspect "${IMAGE}:${RELEASE_TAG}"
